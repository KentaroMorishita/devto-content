name: Publish to DEV.to

on:
  push:
    branches:
      - main
    paths:
      - "articles/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: devto-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish articles
        if: env.DEVTO_API_KEY != ''
        run: npm run publish

      - name: Commit publish state
        if: always() && env.DEVTO_API_KEY != ''
        run: |
          if git diff --quiet -- .devto-state.json; then
            echo "Publish state unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .devto-state.json
          git commit -m "chore: update DEV.to publish state"
          git push

      - name: Skip publishing until API key is configured
        if: env.DEVTO_API_KEY == ''
        run: echo "DEVTO_API_KEY is not configured; skipping DEV.to publishing."
